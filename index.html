<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Forest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2310142a'/%3E%3Cpath d='M15 4a8 8 0 1 0 5 14A7 7 0 0 1 15 4z' fill='%23ffd27a'/%3E%3Ccircle cx='8' cy='15' r='2' fill='%237dffa8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- de onde o navegador baixa o three.js quando o jogo roda sem o Vite (Live Server, GitHub Pages).
         O Vite ignora isto e usa o node_modules. Mantenha a versao igual a do package.json. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <!-- o minimo para a tela de carregamento funcionar mesmo se o CSS nao carregar (arquivo aberto direto) -->
    <style>
      .hidden { display: none !important; }
      body { background: #03040a; color: #eef1ff; font-family: system-ui, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="panel goal" id="goal">
        <span id="goal-icon"></span>
        <div class="col">
          <div class="label"><span id="goal-label"></span> <b id="goal-value"></b></div>
          <div class="bar"><div class="fill" id="goal-fill"></div></div>
        </div>
      </div>

      <div class="panel clock" id="clock-panel">
        <div class="clock-row">
          <span id="clock-from"></span>
          <span id="clock">00:00</span>
          <span id="clock-to"></span>
        </div>
        <div class="night-bar"><div id="clock-fill"></div></div>
      </div>

      <canvas id="minimap" width="168" height="168"></canvas>

      <div class="panel inventory">
        <div id="slots" class="slots">
          <div class="slot" id="slot-apples">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 7c-2-1.6-6-1.2-7 2.2-1 3.6 1.2 9.8 4.2 10.6 1.2.3 1.8-.4 2.8-.4s1.6.7 2.8.4c3-.8 5.2-7 4.2-10.6C18 5.8 14 5.4 12 7z" fill="#d8352a"/><path d="M12 7c0-2 .6-3.4 2-4.4" stroke="#6b3b1d" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M13 5.5c1.6-1.6 3.6-1.4 4.4-.8-1 1.4-2.8 1.8-4.4.8z" fill="#5cbf3b"/></svg>
            <b id="apples">6</b>
          </div>
          <div class="slot" id="slot-fireflies">
            <svg class="icon" viewBox="0 0 24 24"><defs><radialGradient id="ff" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eaffef"/><stop offset=".35" stop-color="#7dffa8"/><stop offset="1" stop-color="#7dffa8" stop-opacity="0"/></radialGradient></defs><circle cx="12" cy="12" r="11" fill="url(#ff)"/></svg>
            <b id="fireflies">0</b><small>/10</small>
          </div>
        </div>
      </div>

      <div class="roar" id="roar">
        <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="prog" id="roar-ring" cx="32" cy="32" r="28"/></svg>
        <div class="roar-label"><b>ESPAÇO</b><span id="roar-text">Rugido</span></div>
      </div>

      <div id="banner"></div>
      <div id="hint" class="hint"></div>
      <div id="toasts"></div>
      <div id="crosshair"></div>
      <div id="vignette"></div>
    </div>

    <div id="screen-loading" class="screen">
      <div class="card">
        <h1>Magic Forest</h1>
        <p class="sub" id="load-text">carregando a floresta…</p>
        <div class="bar big"><div class="fill" id="load-fill"></div></div>
      </div>
    </div>
    <script>
      // aberto com dois cliques (file://): o navegador bloqueia os modulos, entao o jogo nunca carregaria
      if (location.protocol === 'file:') {
        document.querySelector('#screen-loading .bar').style.display = 'none';
        document.querySelector('#screen-loading .sub').innerHTML =
          'Este arquivo não abre com dois cliques: o navegador bloqueia o jogo.<br><br>' +
          'Dê dois cliques em <b>Jogar.bat</b><br>ou abra com o <b>Live Server</b> do VS Code.';
      }
    </script>

    <div id="screen-menu" class="screen hidden">
      <div class="menu">
        <h1 class="title">Magic Forest</h1>
        <p class="sub">Um dia (e uma noite) na vida do ogro</p>
        <div class="phase-cards" id="phase-cards"></div>
        <p class="menu-foot"><span id="menu-stars"></span></p>
      </div>
    </div>

    <div id="screen-intro" class="screen hidden">
      <div class="card wide">
        <p class="kicker" id="intro-kicker"></p>
        <h1 id="intro-title"></h1>
        <p class="story" id="intro-story"></p>
        <div class="cols">
          <ul class="controls" id="intro-controls"></ul>
          <ul class="tips" id="intro-tips"></ul>
        </div>
        <div class="buttons">
          <button id="btn-back" class="btn ghost">Voltar</button>
          <button id="btn-start" class="btn">Começar</button>
        </div>
      </div>
    </div>

    <div id="screen-pause" class="screen hidden">
      <div class="card">
        <h2>Pausado</h2>
        <p class="sub">A floresta espera…</p>
        <div class="buttons column">
          <button id="btn-resume" class="btn">Continuar</button>
          <button id="btn-retry" class="btn ghost">Recomeçar a fase</button>
          <button id="btn-quit" class="btn ghost">Escolher fase</button>
        </div>
      </div>
    </div>

    <div id="screen-end" class="screen hidden">
      <div class="card">
        <h1 id="end-title"></h1>
        <p class="sub" id="end-sub"></p>
        <div class="stars" id="end-stars"></div>
        <dl class="stats" id="end-stats"></dl>
        <div class="buttons column">
          <button id="btn-next" class="btn">Próxima fase</button>
          <button id="btn-restart" class="btn ghost">Jogar de novo</button>
          <button id="btn-menu" class="btn ghost">Escolher fase</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
